name: Daily Drone News

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 WIB
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
        run: |
          ollama serve &
          sleep 5
          ollama pull "$OLLAMA_MODEL"

      - name: Run newsletter
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python newsletter.py

      - name: Commit updated log
        run: |
          git config user.name "drone-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drone_news_log.csv sent_history.json
          git diff --cached --quiet || git commit -m "Daily drone news update"
          git push
